<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tropical Spice</title>
    <link rel="icon" type="image/x-icon" href="./assets/icons/logoTSV1.ico">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Sidebar -->

    <div class="sidebar" id="sidebar">

        <div class="sidebar-header">

           <a href="index.html" class="logo">
                <img src="assets/images/logoTSV1.png" alt="Tropical Spice">
            </a>

            <button id="toggleSidebar" class="toggle-btn">
                ☰
            </button>

        </div>

        <nav class="sidebar-nav">

            <a href="#productos">
                <img src="assets/icons/logoTSV2.ico" alt="Productos" class="nav-icon">
                <span class="nav-text">Productos</span>
            </a>

            <a href="#nosotros">
                <span class="nav-icon">👥</span>
                <span class="nav-text">Nosotros</span>
            </a>

            <a href="#contacto">
                <span class="nav-icon">📱</span>
                <span class="nav-text">Contáctanos</span>
            </a>

        </nav>

    </div>

    <!-- Contenido principal -->

    <main id="main-content">
        <!-- Banner -->
        <section class="hero-banner">

            <picture>

                <!-- Imagen móvil -->

                <source
                    media="(max-width: 768px)"
                    srcset="./assets/images/banner_mobile.png">

                <!-- Imagen escritorio -->

                <img
                    src="./assets/images/banner_desktop.png"
                    alt="Tropical Spice">

            </picture>

        </section>


    </main>

    <!-- Scripts -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
